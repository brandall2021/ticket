# Proxy del helpdesk + túnel Guacamole.
upstream helpdesk_app {
    server app:3000;
}

upstream helpdesk_guacamole {
    server guacamole:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # Único endpoint público de Guacamole: el túnel WebSocket de la sesión.
    # La interfaz de administración del gateway queda inaccesible a propósito.
    location = /guacamole/websocket-tunnel {
        proxy_pass http://helpdesk_guacamole;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /guacamole/ {
        return 404;
    }

    location / {
        proxy_pass http://helpdesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El terminal SSH usa Server-Sent Events: no debe haber buffering.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
